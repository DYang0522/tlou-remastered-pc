name: Linux build

on:
  push:
    branches:
      - linux-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-26.04
    # Ubuntu 26.04 cloud VMs are amd64v3 by default. Build in the official generic
    # amd64 container so the produced ELF files remain runnable on Sandy Bridge.
    container:
      image: ubuntu:26.04
      options: --user root
    timeout-minutes: 120
    steps:
      - name: Prepare container for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git rsync

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify generic Ubuntu 26.04 amd64 build environment
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(dpkg --print-architecture)" = amd64
          if apt-config dump | grep -Eqi 'APT::Architecture-Variants.*amd64v3'; then
            echo 'Refusing an amd64v3 package environment; this build must target Sandy Bridge.' >&2
            exit 1
          fi
          cat /etc/os-release
          apt-config dump | grep -i 'Architecture-Variants' || true

      - name: Dependencies (Ubuntu 26.04 native runtime)
        run: bash gow3_pc/packaging/linux/ci-deps.sh

      - name: Build Linux runtime
        env:
          GOW3_PGO: off
          GOW3_LTO: "ON"
          GOW3_VULKAN_INCLUDE_DIR: /usr/local/include
          CC: gcc-14
          CXX: g++-14
        run: |
          gcc --version
          g++ --version
          git config --global core.autocrlf false
          bash gow3_pc/build.sh
          file gow3_pc/out/gow3-probe
          file gow3_pc/out/gpu/libgow3gpu.so
          ldd gow3_pc/out/gow3-probe | tee "$RUNNER_TEMP/runtime-ldd.txt"
          ldd gow3_pc/out/gpu/libgow3gpu.so | tee "$RUNNER_TEMP/gpu-ldd.txt"
          ! grep -q "not found" "$RUNNER_TEMP/runtime-ldd.txt"
          ! grep -q "not found" "$RUNNER_TEMP/gpu-ldd.txt"

      - name: Run native runtime tests
        env:
          GOW3_PGO: off
          GOW3_LTO: "ON"
          GOW3_VULKAN_INCLUDE_DIR: /usr/local/include
          CC: gcc-14
          CXX: g++-14
        run: bash gow3_pc/build.sh --test

      - name: Install game preparation Python dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/tlou-venv"
          "$RUNNER_TEMP/tlou-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --target gow3_pc/out/pydeps iced-x86==1.21.0 Pillow
          "$RUNNER_TEMP/tlou-venv/bin/python" -c "import sys; sys.path.insert(0, 'gow3_pc/out/pydeps'); import iced_x86; print('iced-x86:', iced_x86.__version__ if hasattr(iced_x86, '__version__') else 'installed')"

      - name: Test Linux GUI launcher without game files
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-tk xvfb
          export LD_LIBRARY_PATH="$PWD/gow3_pc/out${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PYTHONPATH="$PWD/gow3_pc/out/pydeps${PYTHONPATH:+:$PYTHONPATH}"
          xvfb-run -a python3 launcher/tlou_launcher.pyw --close-after 2

      - name: Assemble Linux archive
        shell: bash
        run: |
          STAGE="$RUNNER_TEMP/TLOU-Remastered-linux-x86_64"
          mkdir -p "$STAGE" dist
          rsync -a \
            --exclude='/.git/' --exclude='*/.git/' \
            --exclude='/dist/' --exclude='/analysis/' \
            --exclude='/gow3_pc/out/' --exclude='/gow3_pc/pgo/' \
            ./ "$STAGE/"
          mkdir -p "$STAGE/gow3_pc/out/gpu" "$STAGE/gow3_pc/out/pydeps"
          rsync -a gow3_pc/out/pydeps/ "$STAGE/gow3_pc/out/pydeps/"
          install -m 755 gow3_pc/out/gow3-probe "$STAGE/gow3_pc/out/gow3-probe"
          install -m 755 gow3_pc/out/gow3-gpu-capabilities "$STAGE/gow3_pc/out/gow3-gpu-capabilities"
          install -m 755 gow3_pc/out/gpu/libgow3gpu.so "$STAGE/gow3_pc/out/gpu/libgow3gpu.so"
          SDL3_LIB="$(ldconfig -p | awk '$1 == "libSDL3.so.0" {print $NF; exit}')"
          test -n "$SDL3_LIB"
          install -m 755 -D "$SDL3_LIB" "$STAGE/gow3_pc/out/libSDL3.so.0"
          # glibc rejects ELF files marked as needing x86-64-v3 on Sandy Bridge.
          # Check each shipped ELF and the shared objects it will load, not just compiler flags.
          check_isa_level() {
            local elf="$1" notes
            notes="$(readelf -n "$elf" 2>/dev/null || true)"
            printf '%s\n' "$notes" | grep -E 'x86 ISA needed' || true
            if grep -Eq 'x86 ISA needed:.*x86-64-v[34]' <<< "$notes"; then
              echo "ERROR: $elf requires x86-64-v3/v4; Sandy Bridge only supports up to v2." >&2
              return 1
            fi
          }
          for elf in "$STAGE/gow3_pc/out/gow3-probe" "$STAGE/gow3_pc/out/gow3-gpu-capabilities" "$STAGE/gow3_pc/out/gpu/libgow3gpu.so" "$STAGE/gow3_pc/out/libSDL3.so.0"; do
            check_isa_level "$elf"
            while IFS= read -r dep; do
              [[ -f "$dep" ]] && check_isa_level "$dep"
            done < <(ldd "$elf" | awk '{ for (i=1; i<=NF; ++i) if (index($i, "/") == 1) print $i }' | sort -u)
          done
          chmod 755 "$STAGE/Start-TLOU-Linux.sh" "$STAGE/Start-TLOU-Launcher.sh"
          export LD_LIBRARY_PATH="$STAGE/gow3_pc/out${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$STAGE/gow3_pc/out/gow3-probe" | tee "$RUNNER_TEMP/staged-runtime-ldd.txt"
          ldd "$STAGE/gow3_pc/out/gpu/libgow3gpu.so" | tee "$RUNNER_TEMP/staged-gpu-ldd.txt"
          ! grep -q "not found" "$RUNNER_TEMP/staged-runtime-ldd.txt"
          ! grep -q "not found" "$RUNNER_TEMP/staged-gpu-ldd.txt"
          {
            echo "The Last of Us Remastered - Linux x86_64"
            echo "Build OS: Ubuntu 26.04"
            echo "Source commit: $GITHUB_SHA"
            echo "Compiler: $(g++-14 --version | head -1)"
            echo "FFmpeg: $(pkg-config --modversion libavcodec)"
            echo "fmt: $(dpkg-query -W -f='${Version}' libfmt-dev)"
            echo "Zydis: $(dpkg-query -W -f='${Version}' libzydis-dev)"
            echo "SDL3: $(pkg-config --modversion sdl3)"
            echo "Host runtime packages: FFmpeg 8, fmt 10, Zydis 4.1, Vulkan driver, X11/Wayland."
            echo "No game files are included."
          } > "$STAGE/BUILD-INFO.txt"
          tar -C "$RUNNER_TEMP" -czf dist/TLOU-Remastered-linux-x86_64.tar.gz TLOU-Remastered-linux-x86_64

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-Remastered-linux-x86_64
          path: dist/TLOU-Remastered-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-linux-build-logs
          path: |
            gow3_pc/out/gpu-build.log
            ${{ runner.temp }}/runtime-ldd.txt
            ${{ runner.temp }}/gpu-ldd.txt
            ${{ runner.temp }}/staged-runtime-ldd.txt
            ${{ runner.temp }}/staged-gpu-ldd.txt
          if-no-files-found: ignore
          retention-days: 14
